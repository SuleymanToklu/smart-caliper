name: SmartCaliper CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest tests/ -v --durations=10

      - name: Run Sub-pixel Precision Benchmark
        run: |
          smart-caliper benchmark

  docker:
    name: Docker Container Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t smart-caliper:ci .

      - name: Container Smoke Test
        run: |
          docker run --rm -d -p 8000:8000 --name caliper_smoke smart-caliper:ci
          sleep 4
          curl -f http://localhost:8000/api/health || exit 1
          docker stop caliper_smoke
