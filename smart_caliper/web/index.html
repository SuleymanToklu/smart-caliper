<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mezuram — SmartCaliper ile Milimetrik Ölçüm</title>
  <meta name="application-name" content="SmartCaliper Mezuram">
  <meta name="description" content="Kredi kartı veya bozuk para referansı ile kameradan milimetrik nesne ölçümü.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-root">
    <!-- Top Minimal Floating Header -->
    <header class="top-nav">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M2 12h20M2 12l5-5M2 12l5 5M22 12l-5-5M22 12l-5 5"/>
          </svg>
        </div>
        <span class="brand-title">Mezuram</span>
      </div>

      <!-- Reference Standard Selector -->
      <div class="ref-pill">
        <label for="selectReference" class="ref-label">Referans:</label>
        <select id="selectReference" class="ref-select">
          <option value="iso_card" selected>💳 Kredi Kartı (85.6 mm)</option>
          <option value="coin_1_tl">🪙 1 TL Para (Ø 26.1 mm)</option>
          <option value="coin_1_euro">🪙 1 Euro (Ø 23.2 mm)</option>
          <option value="aruco_4x4_50mm">🏁 ArUco (50 mm)</option>
        </select>
      </div>

      <!-- 1-Click Quick Demo Samples -->
      <div class="quick-samples">
        <button class="btn-sample-mini" data-sample="sample_card_inspection.png" data-ref="iso_card" title="Kart ve Parçalar Örneği">
          💳 Kart Örneği
        </button>
        <button class="btn-sample-mini" data-sample="sample_coin_bracket.png" data-ref="coin_1_tl" title="1 TL ve Parça Örneği">
          🪙 1 TL Örneği
        </button>
      </div>
    </header>

    <!-- Fullscreen Measure Viewport -->
    <main class="measure-viewport" id="viewport">
      <canvas id="cadCanvas"></canvas>
      <video id="webcamVideo" playsinline autoplay muted style="display:none;"></video>

      <!-- Live Camera Viewfinder Overlay -->
      <div class="camera-overlay" id="cameraOverlay" style="display:none;">
        <div class="cam-guide-box">
          <div class="corner-bracket tl"></div>
          <div class="corner-bracket tr"></div>
          <div class="corner-bracket br"></div>
          <div class="corner-bracket bl"></div>
          <span class="cam-guide-text">KARTI BURAYA HİZALAYIN</span>
        </div>
      </div>

      <!-- Sub-pixel Magnifier Loupe -->
      <div class="magnifier-lens" id="magnifierLens" style="display:none;">
        <canvas id="lensCanvas" width="130" height="130"></canvas>
        <div class="lens-crosshair"></div>
        <span class="lens-label">2.5X</span>
      </div>

      <!-- Floating Status Pill -->
      <div class="status-banner" id="statusBanner">
        <span id="statusText">📸 Kamerayı açın veya masanızın fotoğrafını yükleyin</span>
      </div>

      <!-- Live Shutter Bar (visible when camera stream is on) -->
      <div class="shutter-bar" id="shutterBar" style="display:none;">
        <button class="btn-shutter" id="btnShutter" title="Kareyi Dondur ve Ölç">
          <div class="shutter-circle"></div>
        </button>
        <span class="shutter-label">Kareyi Yakala & Ölç</span>
      </div>

      <!-- Empty State Card -->
      <div class="empty-state" id="dropzone">
        <div class="empty-glow-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <h2>Masadaki Eşyaları Ölçün</h2>
        <p>Masaya bir <strong>Kredi Kartı</strong> veya <strong>1 TL</strong> koyun, yanındaki nesnelerin iki ucuna dokunarak milimetrik ölçün.</p>
        <div class="empty-cta-group">
          <button class="btn-pill-primary" id="btnEmptyStartCam">
            🎥 Canlı Kamerayı Aç
          </button>
          <button class="btn-pill-secondary" id="btnEmptyUpload">
            📁 Fotoğraf Yükle
          </button>
          <button class="btn-pill-secondary" id="btnEmptyDemo">
            💳 Örnek Kartla Dene
          </button>
        </div>
      </div>

      <!-- Corner Pin Adjustment Pill (when user is fine-tuning reference card) -->
      <div class="pin-adjust-bar" id="pinAdjustBar" style="display:none;">
        <span>📍 Kartın 4 köşesini parmağınla hizala:</span>
        <button class="btn-action-sm primary" id="btnApplyPins">✓ Onayla</button>
        <button class="btn-action-sm secondary" id="btnResetPins">↺ Sıfırla</button>
        <button class="btn-action-sm danger" id="btnCancelPins">✕ Kapat</button>
      </div>

      <!-- Live Loading Spinner -->
      <div class="loading-overlay" id="loadingOverlay" style="display:none;">
        <div class="spinner-ring"></div>
        <div class="loading-label" id="loadingText">İşleniyor...</div>
      </div>
    </main>

    <!-- Bottom Floating Apple Measure Toolbar -->
    <nav class="bottom-toolbar">
      <!-- Live Camera Toggle -->
      <button class="tool-btn" id="btnToggleCamera" title="Kamera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span id="btnCamText">Kamera</span>
      </button>

      <!-- Upload Photo -->
      <button class="tool-btn" id="btnUploadTrigger" title="Fotoğraf Yükle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Yükle</span>
      </button>
      <input type="file" id="fileInputUpload" accept="image/*" style="display:none;">

      <!-- Measure Mode (Active by default) -->
      <button class="tool-btn active" id="btnMeasureMode" title="İki Nokta Arası Ölç">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="6" r="3"/>
          <circle cx="18" cy="18" r="3"/>
          <line x1="8" y1="8" x2="16" y2="16" stroke-dasharray="2 2"/>
        </svg>
        <span>Ölçüm</span>
      </button>

      <!-- Pin Alignment (Adjust Card) -->
      <button class="tool-btn" id="btnPinMode" title="Kart Köşelerini Düzelt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="7" cy="7" r="1.5" fill="currentColor"/>
          <circle cx="17" cy="7" r="1.5" fill="currentColor"/>
          <circle cx="17" cy="17" r="1.5" fill="currentColor"/>
          <circle cx="7" cy="17" r="1.5" fill="currentColor"/>
        </svg>
        <span>Kartı Hizala</span>
      </button>

      <!-- Clear Measurements -->
      <button class="tool-btn danger" id="btnClearMeasurements" title="Ölçümleri Temizle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        <span>Temizle</span>
      </button>
    </nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
